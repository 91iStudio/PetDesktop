# A release is built here, in the open, from the tagged commit — never on someone's computer.
# GitHub signs a provenance attestation for the exe: anyone can check that a file is exactly this build.
name: release

on:
  push:
    tags: ['v*']

permissions:
  contents: write
  id-token: write
  attestations: write

jobs:
  build:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-dotnet@v4
        with:
          global-json-file: global.json

      - name: Build
        run: dotnet publish PetDesktop.csproj -c Release -o out -p:ContinuousIntegrationBuild=true -p:Deterministic=true

      # A native build too (NativeAOT: no .NET inside, smaller and lighter); needs the C++ tools this runner has.
      - name: Build (native)
        shell: pwsh
        run: |
          dotnet publish PetDesktop.csproj -c Release -o out-native -p:Aot=true -p:ContinuousIntegrationBuild=true -p:Deterministic=true
          Copy-Item out-native/Pushishi.exe out/Pushishi-native.exe

      - name: SHA-256
        shell: pwsh
        run: |
          $lines = foreach ($f in 'Pushishi.exe', 'Pushishi-native.exe') { "$((Get-FileHash out/$f -Algorithm SHA256).Hash.ToLower())  $f" }
          $lines | Out-File -Encoding ascii out/SHA256SUMS.txt
          $lines | ForEach-Object { "SHA-256: $_" } >> $env:GITHUB_STEP_SUMMARY

      - name: Attest
        uses: actions/attest-build-provenance@v2
        with:
          subject-path: |
            out/Pushishi.exe
            out/Pushishi-native.exe

      - name: Release
        uses: softprops/action-gh-release@v2
        with:
          files: |
            out/Pushishi.exe
            out/Pushishi-native.exe
            out/SHA256SUMS.txt
